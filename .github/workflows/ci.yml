# CI do monorepo (issue #2). Um workflow só, com um job por pasta.
#
# Por que não um workflow por pasta com `paths:`? Porque um check obrigatório que
# não roda (ex.: PR só de docs) deixa o PR preso em "Expected — Waiting for status".
# Aqui o workflow roda sempre; o job `mudancas` descobre o que mudou, os jobs de cada
# pasta só rodam quando ela muda e o `ci-ok` resume tudo. Na proteção da main, o
# ÚNICO check obrigatório é o `ci-ok`.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  mudancas:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      frontend: ${{ steps.filtro.outputs.frontend }}
      scripts: ${{ steps.filtro.outputs.scripts }}
      infra: ${{ steps.filtro.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/ci/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
            scripts:
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'docker-compose.yml'
              - '.env.example'
              - 'backend/Dockerfile'
              - 'backend/pyproject.toml'
              - 'frontend/Dockerfile'
              - 'frontend/package-lock.json'
              - '.github/workflows/ci.yml'

  backend:
    needs: mudancas
    if: needs.mudancas.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
          POSTGRES_DB: monitor_vagas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor -d monitor_vagas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@localhost:5432/monitor_vagas
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: sem comentários nem docstrings
        run: python ../scripts/ci/checar_comentarios.py .
      # --exigir-banco: aqui o Postgres TEM que estar de pé; teste de integração
      # pulado no CI seria falso verde.
      - name: pytest
        run: pytest --exigir-banco --cov=app --cov-report=term-missing

  frontend:
    needs: mudancas
    if: needs.mudancas.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  scripts:
    needs: mudancas
    if: needs.mudancas.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest ruff==0.17.6
      - name: ruff check
        run: ruff check scripts
      - name: sem comentários nem docstrings
        run: python scripts/ci/checar_comentarios.py scripts
      - name: pytest
        run: python -m pytest --import-mode=importlib -p no:cacheprovider scripts

  infra:
    needs: mudancas
    if: needs.mudancas.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - name: docker compose config
        run: docker compose config --quiet
      - name: docker build do backend
        run: docker build --tag monitor-de-vagas-backend:ci backend
      - name: docker build do frontend
        run: docker build --tag monitor-de-vagas-frontend:ci frontend

  ci-ok:
    needs: [mudancas, backend, frontend, scripts, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: resumo
        env:
          RESULTADOS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Resultados dos jobs: $RESULTADOS"
          if echo "$RESULTADOS" | grep -E -q '"(failure|cancelled)"'; then
            echo "Algum job falhou ou foi cancelado."
            exit 1
          fi
          echo "Tudo verde (jobs pulados não contam como falha)."

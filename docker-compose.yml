# Ambiente local completo: `make up` (ou `docker compose up -d --build`).
# O `mailpit` entra na issue #20.

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    # Dentro da rede do compose o banco se chama "db", não "localhost".
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # No Windows, mudanças em arquivos montados nem sempre chegam ao container;
    # polling garante que o --reload percebe a alteração.
    WATCHFILES_FORCE_POLLING: "true"
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "${POSTGRES_PORTA:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORTA:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *backend
    command: python -m app.worker.scheduler

  frontend:
    build: ./frontend
    environment:
      # O Next busca as vagas no servidor (Server Component), então fala com a API
      # pela rede do compose. O navegador nunca chama a API direto (sem CORS).
      API_URL: http://api:8000
      # Mesmo motivo do WATCHFILES_FORCE_POLLING do backend: no Windows o watcher
      # nem sempre percebe as mudanças dos arquivos montados.
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONT_PORTA:-3000}:3000"
    volumes:
      - ./frontend:/app
      # node_modules e .next ficam dentro do container (volumes anônimos): os do
      # Windows não servem no Linux e deixariam o dev server lento.
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:

# Configuração do Alembic (issue #3).
# A URL do banco NÃO fica aqui: o alembic/env.py lê do app/config.py (DATABASE_URL do .env).
#
# Uso (dentro do container): make migrate  |  make migration m="adiciona perfis"

[alembic]
script_location = %(here)s/alembic
# Arquivos de migration com data no nome: fica fácil ver a ordem no explorador do VS Code.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[post_write_hooks]
# Passa o ruff em toda migration nova (tira import sem uso e formata), igual ao resto do código.
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --exit-zero --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

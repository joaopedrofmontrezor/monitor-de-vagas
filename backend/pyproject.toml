[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-de-vagas-backend"
version = "0.1.0"
description = "API e worker do Monitor de Vagas"
requires-python = ">=3.12"
# Só entra aqui o que a stack decidida já usa na Sprint 1, para ninguém
# precisar mexer neste arquivo nos PRs de feature (menos conflito de merge).
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1,<3",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    "beautifulsoup4>=4.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "httpx2>=2.16",  # cliente que o TestClient do Starlette recomenda
    "ruff==0.17.6",  # mesma versão do .pre-commit-config.yaml
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: erros básicos · I: ordem dos imports · UP: sintaxe moderna
# B: bugs comuns · SIM: simplificações
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib deixa ter tests/unit/test_x.py e tests/integration/test_x.py sem __init__.py
addopts = "--import-mode=importlib -ra"
markers = ["integracao: precisa do Postgres rodando (pulado se o banco não responder)"]
